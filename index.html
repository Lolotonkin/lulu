<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Calendrier Grand Garçon 🏆</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sky: linear-gradient(180deg, #EAE5FF 0%, #FFF3E4 60%, #E2F0D9 100%);
            --cloud-white: #FFFFFF;
            --target-night: linear-gradient(135deg, #4A4083 0%, #292452 100%);
            --success-bg: linear-gradient(135deg, #A8E6CF 0%, #56AB2F 100%);
            --fail-bg: #E2E8F0;
            --card-shadow: 0 4px 15px rgba(80, 70, 100, 0.1);
        }

        * {
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 8px 4px;
            background: var(--bg-sky);
            min-height: 100vh;
            color: #332C54;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 6px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            margin-bottom: 12px;
            width: 100%;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: #4A4083;
            margin: 0 0 4px 0;
        }

        .subtitle {
            font-size: 0.8rem;
            font-weight: 700;
            color: #6C5CE7;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 6px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .legend-item {
            background: #FFF;
            padding: 3px 6px;
            border-radius: 10px;
        }

        .calendar-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .month-card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            padding: 8px 3px;
            box-shadow: var(--card-shadow);
            width: 100%;
        }

        .month-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
            text-align: center;
            color: #FF7675;
            margin-bottom: 8px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 700;
            font-size: 0.68rem;
            color: #8C7AE6;
            margin-bottom: 4px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            width: 100%;
        }

        .day-cell {
            min-height: 52px;
            background: var(--cloud-white);
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2px 1px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .day-cell:active {
            transform: scale(0.95);
        }

        .day-cell.empty {
            visibility: hidden;
            border: none;
            background: transparent;
        }

        .day-cell.target-night {
            background: var(--target-night);
            color: #FFF;
            border-color: #786FA6;
        }

        .day-cell.status-success {
            background: var(--success-bg) !important;
            border-color: #56AB2F !important;
            color: #FFF !important;
        }

        .day-cell.status-fail {
            background: var(--fail-bg) !important;
            border-color: #CBD5E1 !important;
            color: #64748B !important;
        }

        .day-num {
            font-family: 'Fredoka One', cursive;
            font-size: 0.75rem;
            align-self: flex-start;
            margin-left: 2px;
            line-height: 1;
        }

        .day-status {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            line-height: 1;
        }

        .badge-target {
            font-size: 0.45rem;
            font-weight: 700;
            background: #FFD166;
            color: #2D3436;
            padding: 1px 2px;
            border-radius: 4px;
            white-space: nowrap;
            margin-bottom: 1px;
        }

        @keyframes pop {
            0% { transform: scale(0.6); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 Mon Calendrier de Grand 🏆</h1>
        <div class="subtitle">En route vers l'objectif sans tétine ! 🚀</div>
        <div class="legend">
            <div class="legend-item">🌙 Soirée</div>
            <div class="legend-item">⭐ Réussi</div>
            <div class="legend-item">🌧️ Pas réussi</div>
        </div>
    </header>

    <div class="calendar-container" id="calendar"></div>

    <script>
        const targetDatesList = [
            "2026-09-16", "2026-09-23", "2026-09-24", "2026-09-30",
            "2026-10-01", "2026-10-03", "2026-10-07", "2026-10-08", "2026-10-10",
            "2026-10-12", "2026-10-14", "2026-10-15", "2026-10-16", "2026-10-17",
            "2026-10-19", "2026-10-20", "2026-10-21", "2026-10-22", "2026-10-23",
            "2026-10-24", "2026-10-26", "2026-10-27", "2026-10-28", "2026-10-29",
            "2026-10-30", "2026-10-31",
            "2026-11-01", "2026-11-02"
        ];

        const TARGET_DATES = new Set(targetDatesList);
        let savedData = JSON.parse(localStorage.getItem('tetine_tracker')) || {};

        function saveData() {
            localStorage.setItem('tetine_tracker', JSON.stringify(savedData));
        }

        function createCalendar() {
            const container = document.getElementById('calendar');
            const months = [
                { year: 2026, month: 8, name: "Septembre 2026 🌙" },
                { year: 2026, month: 9, name: "Octobre 2026 ⭐" },
                { year: 2026, month: 10, name: "Novembre 2026 🚀" }
            ];

            const weekDays = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];

            months.forEach(m => {
                const monthCard = document.createElement('div');
                monthCard.className = 'month-card';

                const title = document.createElement('div');
                title.className = 'month-title';
                title.innerText = m.name;
                monthCard.appendChild(title);

                const weekHeader = document.createElement('div');
                weekHeader.className = 'weekdays';
                weekDays.forEach(day => {
                    const d = document.createElement('div');
                    d.innerText = day;
                    weekHeader.appendChild(d);
                });
                monthCard.appendChild(weekHeader);

                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';

                const firstDay = new Date(m.year, m.month, 1);
                const lastDay = new Date(m.year, m.month + 1, 0);

                let startingDay = firstDay.getDay() - 1;
                if (startingDay === -1) startingDay = 6;

                for (let i = 0; i < startingDay; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'day-cell empty';
                    daysGrid.appendChild(emptyCell);
                }

                for (let day = 1; day <= lastDay.getDate(); day++) {
                    const monthStr = String(m.month + 1).padStart(2, '0');
                    const dayStr = String(day).padStart(2, '0');
                    const dateStr = `${m.year}-${monthStr}-${dayStr}`;

                    const cell = document.createElement('div');
                    cell.className = 'day-cell';

                    const isTarget = TARGET_DATES.has(dateStr);
                    if (isTarget) cell.classList.add('target-night');

                    const num = document.createElement('div');
                    num.className = 'day-num';
                    num.innerText = day;
                    cell.appendChild(num);

                    const statusDiv = document.createElement('div');
                    statusDiv.className = 'day-status';

                    const currentStatus = savedData[dateStr] || 'none';
                    applyCellState(cell, statusDiv, currentStatus, isTarget);
                    cell.appendChild(statusDiv);

                    if (isTarget && currentStatus === 'none') {
                        const badge = document.createElement('div');
                        badge.className = 'badge-target';
                        badge.innerText = '🚀 Soirée';
                        cell.appendChild(badge);
                    }

                    cell.addEventListener('click', () => {
                        let nextStatus = 'success';
                        if (savedData[dateStr] === 'success') nextStatus = 'fail';
                        else if (savedData[dateStr] === 'fail') nextStatus = 'none';

                        savedData[dateStr] = nextStatus;
                        saveData();

                        statusDiv.classList.add('pop');
                        setTimeout(() => statusDiv.classList.remove('pop'), 300);

                        applyCellState(cell, statusDiv, nextStatus, isTarget);

                        const oldBadge = cell.querySelector('.badge-target');
                        if (oldBadge) oldBadge.remove();
                        if (isTarget && nextStatus === 'none') {
                            const badge = document.createElement('div');
                            badge.className = 'badge-target';
                            badge.innerText = '🚀 Soirée';
                            cell.appendChild(badge);
                        }
                    });

                    daysGrid.appendChild(cell);
                }

                monthCard.appendChild(daysGrid);
                container.appendChild(monthCard);
            });
        }

        function applyCellState(cell, statusDiv, status, isTarget) {
            cell.classList.remove('status-success', 'status-fail');

            if (status === 'success') {
                statusDiv.innerText = '⭐';
                cell.classList.add('status-success');
            } else if (status === 'fail') {
                statusDiv.innerText = '🌧️';
                cell.classList.add('status-fail');
            } else if (isTarget) {
                statusDiv.innerText = '🌙';
            } else {
                statusDiv.innerText = '☁️';
            }
        }

        createCalendar();
    </script>
</body>
</html>
